<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBT MATE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="logo-container">
            <h1>DEBT MATE</h1>
            <p>Organizando los pagos de tu familia</p>
        </div>
        <div class="auth-actions">
            <p style="color: var(--text-gray); font-size: 14px; margin-bottom: 5px;">Selecciona tu perfil</p>
            <button class="btn-primary btn-user" data-user="Andy" style="margin-bottom: 5px;">👤 Entrar como Andy</button>
            <button class="btn-primary btn-user" data-user="Victoria" style="background-color: #2C3E50;">👤 Entrar como Victoria</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
        <header class="app-header">
            <div>
                <span id="user-greeting">Hola, Andy</span>
            </div>
            <div class="profile-icon" id="btn-logout" title="Cambiar de usuario" style="cursor: pointer;">👤</div>
        </header>

        <section class="debt-summary">
            <p>Total Deuda Familiar</p>
            <h2 id="total-debt-amount">$ 0.00</h2>
            <span class="status-badge" id="alert-status">● Al día</span>
        </section>

        <div class="action-buttons">
            <button class="icon-btn" id="btn-historial">🕒 <span>Historial</span></button>
            <button class="icon-btn" id="btn-new-debt">+ <span>Nueva Deuda</span></button>
        </div>

        <section class="debt-list-container">
            <h3>Tus Deudas Activas</h3>
            <div id="debt-list"></div>
        </section>
    </div>

    <!-- Modales -->
    <div id="modal-new-debt" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h3 style="color: #0B2B5E; margin-bottom: 15px;">Registrar Deuda</h3>
            <form id="form-new-debt" class="form-styled">
                <input type="text" id="input-nombre" placeholder="Nombre de la deuda" required>
                <input type="number" id="input-monto-original" placeholder="Monto original del préstamo" step="0.01" required>
                <input type="number" id="input-saldo-actual" placeholder="Saldo pendiente actual" step="0.01" required>
                <input type="number" id="input-cuotas-totales" placeholder="Total de cuotas del préstamo" required>
                <input type="number" id="input-cuotas-pagadas" placeholder="Cuotas ya pagadas (0 si es nueva)" required>
                <input type="number" id="input-valor" placeholder="Valor de cada cuota" step="0.01" required>
                <input type="number" id="input-dia" placeholder="Día de pago mensual" min="1" max="31" required>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Guardar Registro</button>
            </form>
        </div>
    </div>

    <div id="modal-edit-debt" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-edit-modal">&times;</span>
            <h3 style="color: #0B2B5E; margin-bottom: 15px;">Corregir Datos</h3>
            <form id="form-edit-debt" class="form-styled">
                <input type="hidden" id="edit-id">
                <label class="form-label">Nombre de la deuda</label>
                <input type="text" id="edit-nombre" required>
                <label class="form-label">Monto original</label>
                <input type="number" id="edit-monto-original" step="0.01" required>
                <label class="form-label">Saldo pendiente actual</label>
                <input type="number" id="edit-saldo-actual" step="0.01" required>
                <label class="form-label">Total de cuotas</label>
                <input type="number" id="edit-cuotas-totales" required>
                <label class="form-label">Cuotas ya pagadas</label>
                <input type="number" id="edit-cuotas-pagadas" required>
                <label class="form-label">Valor de cada cuota</label>
                <input type="number" id="edit-valor" step="0.01" required>
                <label class="form-label">Día de pago mensual</label>
                <input type="number" id="edit-dia" min="1" max="31" required>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Guardar Corrección</button>
            </form>
        </div>
    </div>

    <div id="modal-historial" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-historial">&times;</span>
            <h3 style="color: #0B2B5E; margin-bottom: 15px;">Historial de Pagos</h3>
            <div id="lista-historial" style="max-height: 350px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=13"></script>
</body>
</html>
